<!DOCTYPE html> 
<html>
<head>
    <meta charset="UTF-8">
    <title>Đăng ký</title>
    <link rel="stylesheet" href="signup(btl).css">
    <script src="jquery.js"></script>
    <script src="signup1.js"></script>
</head>
<body>
<div id="signup">
    <div class="signup-image">  
        <img src="slide1.jpg">
    </div>

    <div class="signup-form">
        <a href="index.html" class="back-home">← Về trang chủ</a>
        <form>
            <h2>ĐĂNG KÝ</h2>
            <input type="text" id="fullname" placeholder="Họ và tên">
            <input type="date" id="birthday">
            <input type="email" id="email" placeholder="Email">
            <input type="text" id="username" placeholder="Tài khoản">
            <input type="text" id="phone" placeholder="Số điện thoại">
            <input type="password" id="password" placeholder="Mật khẩu">
            <input type="password" id="repassword" placeholder="Nhập lại mật khẩu">
            <button type="button" id="signup-btn">
                ĐĂNG KÝ
            </button>
            <div class="login-link">
                Bạn đã có tài khoản?
                <a href="login.html">Đăng nhập</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
