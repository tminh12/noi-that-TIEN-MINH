<!DOCTYPE html> 
<html>
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập</title>
    <link rel="stylesheet" href="login(btl).css">
    <script src="jquery.js"></script>
    <script src="login1.js"></script>
</head>
<body>
<div id="login">
    <div class="login-image">  
        <img src="slide2.jpg">
    </div>

    <div class="login-form">
        <a href="index.html" class="back-home">← Về trang chủ</a>
        <form>
            <h2>ĐĂNG NHẬP</h2>
            <input type="text" id="username" placeholder="Tài khoản">
            <input type="password" id="password" placeholder="Mật khẩu">
            <button type="button" id="login-btn">
                ĐĂNG NHẬP
            </button>
            <div class="signup-link">
                Bạn chưa có tài khoản?
                <a href="signup.html">Đăng ký</a>
            </div>
            <div class="forgot">
                <h3>Bạn quên mật khẩu? Nhập email để lấy lại mật khẩu!</h3>
                <input type="email" placeholder="Nhập email">
                <button>LẤY LẠI MẬT KHẨU</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
